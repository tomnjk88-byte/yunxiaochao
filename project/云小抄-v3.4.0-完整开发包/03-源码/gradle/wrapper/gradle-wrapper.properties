distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 8.14.x 是 Gradle 8 的最后一个稳定系列，AGP 8.13 要求 Gradle ≥ 8.13，
# 8.14.3 是其中验证最充分的一个补丁版；9.x 对 AGP 8.x 属于前沿组合，先不用。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip
# 首次要下约 130MB，Windows + 国内网络给足 2 分钟，避免超时重试
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
