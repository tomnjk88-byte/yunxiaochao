  .wash{position:absolute;inset:0;background:
        linear-gradient(180deg,rgba(12,7,22,.30),rgba(10,6,18,.46))}
  .inner{position:relative;padding:19px 18px 21px}
  .ct{display:flex;align-items:center;gap:8px}
  .ct h3{font-size:19px;font-weight:800;color:#fff;letter-spacing:.3px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .badge{font-size:9px;padding:3px 8px;border-radius:99px;color:#E6D8FF;
          background:rgba(132,73,199,.30);border:1px solid rgba(178,130,240,.55)}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:13px;
        padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.075);
        border:1px solid rgba(255,255,255,.09)}
  .row .l{font-size:12.5px;color:#fff;font-weight:600}
  .row .r{font-size:10px;color:rgba(255,255,255,.55)}
  .btn{margin-top:13px;height:40px;border-radius:13px;display:grid;place-items:center;
        background:linear-gradient(90deg,#8449C7,#A16BE8);color:#fff;font-size:13px;font-weight:700;
        box-shadow:0 6px 18px rgba(132,73,199,.42)}
  .peek{margin-top:-9px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
         height:46px;display:flex;align-items:center;padding:0 16px;position:relative;
         box-shadow:0 8px 18px rgba(0,0,0,.34)}
  .peek .art{opacity:.9}
  .peek .wash{background:linear-gradient(180deg,rgba(12,7,22,.36),rgba(10,6,18,.56))}
  .peek span{position:relative;font-size:14px;font-weight:600;color:#fff}
  .hint{margin-top:12px;font-size:10.5px;color:rgba(255,255,255,.55);padding-left:6px}

  /* Dock */
  .dock{position:absolute;left:16px;right:16px;bottom:14px;height:64px;border-radius:99px;
         background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.10) 52%,rgba(255,255,255,.05));
         border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(22px) saturate(1.3);
         display:flex;align-items:center;padding:0 6px;
         box-shadow:0 12px 32px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.34)}
  .ditem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;border-radius:99px}
  .ditem.on{background:linear-gradient(180deg,rgba(132,73,199,.34),rgba(132,73,199,.16))}
  .ico{width:22px;height:22px;border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.20)}
  .ditem.on .ico{border-color:rgba(178,130,240,.9);box-shadow:0 0 0 1px rgba(132,73,199,.5)}
  .ico i{display:block;width:100%;height:100%;background-size:cover;background-position:center}
  .ditem b{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.58)}
  .ditem.on b{color:#E2CFFF}

  /* 商店卡 */
  .store{width:430px}
  .stitle{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .stitle h4{font-size:13px;color:#fff;font-weight:700}
  .stitle small{font-size:9.5px;color:#7d7891}
  .scard{position:relative;height:220px;border-radius:18px;overflow:hidden;
