name: Build Debug APK

# 云小抄 v2.5.3 一键出包
# 触发：仓库 Actions 页面手动点 Run workflow，或 push 到 main 时自动跑
# 产物：app-debug.apk，已用工程自带 guide.keystore 签名，可直接安装
# 耗时：首次约 6~9 分钟（含依赖下载），之后有缓存约 4~5 分钟

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/build-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          # 工程 settings.gradle.kts 默认走阿里云镜像；GitHub runner 在海外，阿里云反而慢
          YUNX_USE_MIRROR: 'false'
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show Kotlin compile errors if any
        if: failure()
        run: |
          echo "=== 搜 build 目录下的编译错误 ==="
          find . -name "*.log" -path "*/build/*" -exec sh -c 'echo "--- $1"; grep -E "^e: |^error:" "$1" | head -40' _ {} \; 2>/dev/null || true

      - name: Locate APK
        id: find
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::没有产出 APK"; exit 1; fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -5 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 云小抄-v2.5.3-debug
          path: ${{ steps.find.outputs.apk }}
          if-no-files-found: error
          retention-days: 90
