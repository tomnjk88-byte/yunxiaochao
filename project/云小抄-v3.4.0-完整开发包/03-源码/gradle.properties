# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
android.nonTransitiveRClass=true
android.useAndroidX=true
# 允许项目路径包含非 ASCII 字符（本机路径为中文目录，仅本地构建用）
android.overridePathCheck=true
kotlin.code.style=official
org.gradle.configureondemand=false
org.gradle.daemon=false
# 沙箱构建机 cgroup 上限 8GB：堆压到 3.2G，R8/lint 才不会触发 OOM kill
org.gradle.jvmargs=-Xmx3200m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
# Kotlin 编译器跑在 Gradle 同一个 JVM 内，避免再起一个 1G 的 Kotlin 守护进程
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
org.gradle.caching=true
# 离线构建：禁止 AGP 联网检查/自动下载缺失的 SDK 组件（沙箱内 dl.google.com 不可达）
# 打包源码时已注释掉：在能联网的机器上构建，允许 AGP 自动补装缺失的 SDK 组件，否则缺 build-tools 会直接报错。
# android.builder.sdkDownload=false
# aapt2 官方只发 x86_64 二进制；本机是 x86_64，用 build-tools 自带的 aapt2，注释掉原 aarch64 shim
# android.aapt2FromMavenOverride=/opt/aapt2-shim/aapt2
